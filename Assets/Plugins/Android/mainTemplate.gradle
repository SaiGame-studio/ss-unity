    implementation 'com.unity3d.ads-mediation:mobilefuse-adapter:5.7.0' // Assets/LevelPlay/Editor/ISMobileFuseAdapterDependencies.xml:5
    implementation 'com.unity3d.ads-mediation:moloco-adapter:5.22.0' // Assets/LevelPlay/Editor/ISMolocoAdapterDependencies.xml:5
